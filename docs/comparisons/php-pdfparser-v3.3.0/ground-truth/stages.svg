<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160" role="img" aria-labelledby="title desc">
  <title id="title">Three project stages</title>
  <desc id="desc">Plan, Build, and Ship shown as three connected boxes</desc>
  <rect width="720" height="160" fill="#ffffff"/>
  <g font-family="sans-serif" font-size="28" text-anchor="middle">
    <rect x="30" y="45" width="170" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="115" y="89" fill="#1e3a8a">Plan</text>
    <path d="M200 80h60" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="275" y="45" width="170" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="360" y="89" fill="#14532d">Build</text>
    <path d="M445 80h60" stroke="#475569" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="520" y="45" width="170" height="70" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="605" y="89" fill="#78350f">Ship</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
</svg>
