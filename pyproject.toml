[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pdf-to-carve"
version = "0.1.0"
description = "Convert PDFs and document images into validated Carve source"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "markup-carve" }]
keywords = ["carve", "pdf", "ocr", "document-conversion"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup",
  "Topic :: Utilities",
]
dependencies = ["pypdfium2>=5.0,<6", "Pillow>=10,<13"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5", "ruff>=0.11", "PyMuPDF>=1.24,<2"]
pymupdf = ["PyMuPDF>=1.24,<2"]

[project.scripts]
pdf-to-carve = "pdf_to_carve.cli:main"

[project.urls]
Homepage = "https://github.com/markup-carve/pdf-to-carve"
Repository = "https://github.com/markup-carve/pdf-to-carve"
Documentation = "https://github.com/markup-carve/pdf-to-carve#readme"
Changelog = "https://github.com/markup-carve/pdf-to-carve/blob/main/CHANGELOG.md"
Issues = "https://github.com/markup-carve/pdf-to-carve/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_to_carve"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
